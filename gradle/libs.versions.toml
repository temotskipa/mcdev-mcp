[versions]
mcpSdk = "2.1.0-SNAPSHOT"
# Reviewed transitive versions of the MCP SDK; verified by mcpSdkSnapshotCheck.
jackson3 = "3.1.4"
jsonSchemaValidator = "3.0.6"
jacksonAnnotations = "2.22"
picocli = "4.7.7"
h2 = "2.5.250"
vineflower = "1.12.0"
tinyRemapper = "0.14.1"
mappingIo = "0.9.1"
slf4j = "2.0.18"
servletApi = "6.1.0"
junit = "6.1.3"
jspecify = "1.0.0"

[libraries]
mcpSdk = { module = "io.modelcontextprotocol.sdk:mcp", version.ref = "mcpSdk" }
mcpSdkCore = { module = "io.modelcontextprotocol.sdk:mcp-core", version.ref = "mcpSdk" }
mcpSdkJsonJackson3 = { module = "io.modelcontextprotocol.sdk:mcp-json-jackson3", version.ref = "mcpSdk" }
jacksonAnnotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jacksonAnnotations" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
vineflower = { module = "org.vineflower:vineflower", version.ref = "vineflower" }
tinyRemapper = { module = "net.fabricmc:tiny-remapper", version.ref = "tinyRemapper" }
mappingIo = { module = "net.fabricmc:mapping-io", version.ref = "mappingIo" }
slf4jNop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
servletApi = { module = "jakarta.servlet:jakarta.servlet-api", version.ref = "servletApi" }
junitBom = { module = "org.junit:junit-bom", version.ref = "junit" }
junitJupiter = { module = "org.junit.jupiter:junit-jupiter" }
junitPlatformLauncher = { module = "org.junit.platform:junit-platform-launcher" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
