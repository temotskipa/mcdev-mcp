name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Java ${{ matrix.runtime }} tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [25, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            25
            26
      - name: Test with Java ${{ matrix.runtime }}
        run: >-
          ./gradlew
          -Dorg.gradle.java.installations.paths="$JAVA_HOME_25_X64,$JAVA_HOME_26_X64"
          clean check cutoverCheck shadowJar --console=plain
          -PtestJavaVersion=${{ matrix.runtime }}
      - uses: actions/upload-artifact@v7
        if: matrix.runtime == '25'
        with:
          name: mcdev-mcp-java-25
          path: build/libs/mcdev-mcp-*.jar
          retention-days: 7
