name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [25, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - run: ./gradlew clean test shadowJar --console=plain
      - uses: actions/upload-artifact@v7
        if: matrix.java == '25'
        with:
          name: mcdev-mcp-java-25
          path: build/libs/mcdev-mcp-*.jar
          retention-days: 7
