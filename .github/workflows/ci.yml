name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    name: Build once on the preview JDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the preview Java feature
        id: preview-java
        shell: bash
        run: |
          set -euo pipefail
          feature="$(sed -n 's/^javaFeature=//p' gradle.properties | tr -d '\r')"
          test -n "$feature"
          early_access="$(sed -n 's/^javaEarlyAccess=//p' gradle.properties | tr -d '\r')"
          if [ "$early_access" = "true" ]; then
            version="$feature-ea"
          else
            version="$feature"
          fi
          echo "feature=$feature" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ steps.preview-java.outputs.version }}
          cache: gradle
      - name: Test and produce the release provenance payload
        run: >-
          ./gradlew clean test check shadowJar runtimeTestBundle
          releaseArtifactBundle --rerun-tasks --no-build-cache --no-configuration-cache --console=plain
      - name: Verify staged JAR checksum
        shell: bash
        run: |
          set -euo pipefail
          cd build/artifacts/release
          test "$(find . -maxdepth 1 -name 'mcdev-mcp-*.jar' -type f | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name 'mcdev-mcp-*.jar.sha256' -type f | wc -l)" -eq 1
          sha256sum --check mcdev-mcp-*.jar.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build
          path: build/artifacts/release/*
          if-no-files-found: error
          retention-days: 7

  parity:
    name: Frozen Node parity
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Read the preview Java feature
        id: preview-java
        shell: bash
        run: |
          set -euo pipefail
          feature="$(sed -n 's/^javaFeature=//p' gradle.properties | tr -d '\r')"
          test -n "$feature"
          early_access="$(sed -n 's/^javaEarlyAccess=//p' gradle.properties | tr -d '\r')"
          if [ "$early_access" = "true" ]; then
            version="$feature-ea"
          else
            version="$feature"
          fi
          echo "feature=$feature" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ steps.preview-java.outputs.version }}
          cache: gradle
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-build
          path: downloaded
      - name: Stage the checksum-verified producer JAR for parity
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version=//p' gradle.properties)"
          test -n "$version"
          (cd downloaded && sha256sum --check "mcdev-mcp-$version.jar.sha256")
          mkdir -p build/libs
          cp "downloaded/mcdev-mcp-$version.jar" "downloaded/mcdev-mcp-$version.jar.sha256" build/libs/
      - name: Materialize the immutable master oracle worktree
        shell: bash
        run: |
          set -euo pipefail
          oracle_commit='7b98bdb4a1d885d588cd141d8eb21e3c5c18b2b6'
          oracle_worktree="$RUNNER_TEMP/mcdev-mcp-node-oracle"
          git checkout --detach "$GITHUB_SHA"
          git branch -f master "$oracle_commit"
          git worktree add "$oracle_worktree" master
          test "$(git -C "$oracle_worktree" rev-parse HEAD)" = "$oracle_commit"
          test -z "$(git -C "$oracle_worktree" status --porcelain=v1 --untracked-files=all)"
      - name: Compare the Java CLI and complete MCP surface with the frozen Node server
        run: ./gradlew parityTest --rerun-tasks -x test -x shadowJar --no-configuration-cache --console=plain
      - name: Verify parity preserved the producer JAR
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version=//p' gradle.properties)"
          cd build/libs
          sha256sum --check "$GITHUB_WORKSPACE/downloaded/mcdev-mcp-$version.jar.sha256"
          cmp "mcdev-mcp-$version.jar" "$GITHUB_WORKSPACE/downloaded/mcdev-mcp-$version.jar"

  runtime-matrix:
    name: Exact JAR on ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the preview Java feature
        id: preview-java
        shell: bash
        run: |
          set -euo pipefail
          feature="$(sed -n 's/^javaFeature=//p' gradle.properties | tr -d '\r')"
          test -n "$feature"
          early_access="$(sed -n 's/^javaEarlyAccess=//p' gradle.properties | tr -d '\r')"
          if [ "$early_access" = "true" ]; then
            version="$feature-ea"
          else
            version="$feature"
          fi
          echo "feature=$feature" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ steps.preview-java.outputs.version }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-build
          path: downloaded
      - name: Verify and execute the compiled runtime harness
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundles=(downloaded/mcdev-mcp-runtime-test-*.zip)
          test "${#bundles[@]}" -eq 1
          rm -rf runtime
          mkdir runtime
          unzip -q "${bundles[0]}" -d runtime
          cd runtime/server
          checksums=(mcdev-mcp-*.jar.sha256)
          test "${#checksums[@]}" -eq 1
          recorded="$(awk '{print $1}' "${checksums[0]}")"
          jars=(mcdev-mcp-*.jar)
          test "${#jars[@]}" -eq 1
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "${jars[0]}" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 "${jars[0]}" | awk '{print $1}')"
          fi
          test "$actual" = "$recorded"
          cd ../..
          java --enable-preview --illegal-native-access=deny \
            -cp "runtime/harness:runtime/server/${jars[0]#./}" \
            dev.mcdevmcp.packaging.RuntimeArtifactSmokeMain \
            "runtime/server/${jars[0]#./}"

  package:
    name: Application image and MCPB on ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the preview Java feature
        id: preview-java
        shell: bash
        run: |
          set -euo pipefail
          feature="$(sed -n 's/^javaFeature=//p' gradle.properties | tr -d '\r')"
          test -n "$feature"
          early_access="$(sed -n 's/^javaEarlyAccess=//p' gradle.properties | tr -d '\r')"
          if [ "$early_access" = "true" ]; then
            version="$feature-ea"
          else
            version="$feature"
          fi
          echo "feature=$feature" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ steps.preview-java.outputs.version }}
          cache: gradle
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packaging/mcpb/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-build
          path: downloaded
      - name: Wrap the build-once JAR in an application image and an MCPB bundle
        shell: bash
        run: ./gradlew appImageZip mcpbBundle -PprebuiltRelease=downloaded --no-configuration-cache --console=plain
      - name: Exercise the image and the unpacked bundle before and after each records its startup cache
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundles=(downloaded/mcdev-mcp-runtime-test-*.zip)
          test "${#bundles[@]}" -eq 1
          rm -rf runtime
          mkdir runtime
          unzip -q "${bundles[0]}" -d runtime
          jars=(runtime/server/mcdev-mcp-*.jar)
          test "${#jars[@]}" -eq 1
          version="$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')"
          separator=":"
          if [ "$RUNNER_OS" = "Windows" ]; then separator=";"; fi
          classpath="runtime/harness${separator}${jars[0]}"
          java --enable-preview -cp "$classpath" dev.mcdevmcp.packaging.AppImageSmokeMain \
            build/packaging/image "$version" build/packaging/smoke
          java --enable-preview -cp "$classpath" dev.mcdevmcp.packaging.McpbBundleSmokeMain \
            build/packaging/mcpb build/packaging/mcpb-smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.os }}
          path: |
            build/distributions/mcdev-mcp-*-*.zip
            build/distributions/mcdev-mcp-*-*.mcpb
          if-no-files-found: error
          retention-days: 7

  verify-assets:
    name: Verify the complete set of release assets
    needs: [ build, package ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-build
          path: downloaded/release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: downloaded/packages
          merge-multiple: true
      - name: Materialize only the publishable assets
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version=//p' gradle.properties | tr -d '\r')"
          test -n "$version"
          mkdir release-assets
          cp "downloaded/release/mcdev-mcp-$version.jar" release-assets/
          cp "downloaded/release/mcdev-mcp-$version.jar.sha256" release-assets/
          cp downloaded/packages/* release-assets/
      - name: Verify release provenance
        shell: pwsh
        run: |
          $version = (Get-Content gradle.properties | Where-Object { $_ -like 'version=*' }).Substring(8)
          ./scripts/verify-release-assets.ps1 -DryRun -Version $version -Directory release-assets
